<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowSpot - تطبيق العميلة</title>
<link rel="stylesheet" href="glowspot-style.css">
<style>
  #app { padding-bottom: 76px; }
  .gs-search { display:flex; gap:8px; align-items:center; background:#fff; border-radius:14px; padding:10px 14px; box-shadow: var(--gs-shadow); }
  .gs-search input { border:none; outline:none; flex:1; font-size:14px; font-family:inherit; }
  .gs-shortcuts { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-top:16px; }
  .gs-shortcut { background:#fff; border:1px solid var(--gs-border); border-radius:14px; padding:12px 6px; text-align:center; cursor:pointer; font-size:12px; font-weight:600; }
  .gs-shortcut .ic { font-size:22px; margin-bottom:4px; }
  .gs-banner { border-radius:18px; padding:22px; color:#fff; margin-top:16px; background: linear-gradient(135deg,#d6336c,#7048e8); position:relative; overflow:hidden;}
  .gs-banner h2{margin:0 0 6px;font-size:18px;} .gs-banner p{margin:0;font-size:12.5px;opacity:.9;}
  .gs-header-light { background:#fff; padding:16px; border-bottom:1px solid var(--gs-border); }
  .gs-greet{font-size:15px;font-weight:800;color:var(--gs-text);margin-bottom:10px;}
  .gs-center-row{display:flex; gap:10px; align-items:flex-start;}
  .gs-center-row .fav-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#ccc;}
  .gs-center-row .fav-btn.on{color:var(--gs-primary);}
  .gs-list-card{display:flex;gap:12px;padding:12px;border:1px solid var(--gs-border);border-radius:14px;background:#fff;margin-bottom:10px;cursor:pointer;}
  .gs-list-card .thumb{width:60px;height:60px;border-radius:12px;background:linear-gradient(135deg,#d6336c,#7048e8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0;}
  .gs-reminder{background:#fff3bf;color:#997404;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;}
  .gs-review-stars{font-size:26px;letter-spacing:4px;cursor:pointer;color:#ddd;text-align:center;margin:10px 0;}
  .gs-review-stars span.active{color:#f59f00;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="gs-toast"></div>

<script src="glowspot-storage.js"></script>
<script>
(function(){
  'use strict';
  var S = window.storage;
  var state = {
    tab: 'explore',
    exploreDept: null,
    search: '',
    booking: null // active booking flow object
  };

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function currentCustomer(){
    var sess = S.getSession('customer');
    if (!sess || sess.role !== 'customer') return null;
    return S.getById(S.KEYS.customers, sess.id);
  }

  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function stars(n){
    n = Math.round(n||0);
    var out='';
    for(var i=0;i<5;i++) out += '<span class="gs-star">'+(i<n?'★':'☆')+'</span>';
    return out;
  }

  /* ---------------- AUTH ---------------- */
  function renderAuth(mode){
    mode = mode || 'login';
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="gs-login-wrap"><div class="gs-login-card">'+
      '<div class="gs-logo-big">✨ GlowSpot</div>'+
      '<div class="gs-tag">جمالكِ يبدأ من هنا</div>'+
      (mode==='login' ? renderLoginForm() : renderSignupForm())+
      '</div></div>';

    if (mode==='login'){
      document.getElementById('loginBtn').onclick = function(){
        var phone = document.getElementById('loginPhone').value.trim();
        var pass = document.getElementById('loginPass').value;
        var customers = S.getAll(S.KEYS.customers);
        var c = customers.filter(function(x){ return x.phone===phone && x.password===pass; })[0];
        if (!c){ toast('رقم الهاتف أو كلمة المرور غير صحيحة'); return; }
        S.setSession({ role:'customer', id: c.id });
        renderApp();
      };
      document.getElementById('goSignup').onclick = function(){ renderAuth('signup'); };
    } else {
      document.getElementById('signupBtn').onclick = function(){
        var name = document.getElementById('suName').value.trim();
        var phone = document.getElementById('suPhone').value.trim();
        var pass = document.getElementById('suPass').value;
        if (!name || !phone || !pass){ toast('يرجى تعبئة جميع الحقول'); return; }
        var customers = S.getAll(S.KEYS.customers);
        if (customers.some(function(x){ return x.phone===phone; })){ toast('رقم الهاتف مسجل مسبقاً'); return; }
        var c = S.add(S.KEYS.customers, { name:name, phone:phone, password:pass, favorites:[], favoriteExperts:[] });
        S.setSession({ role:'customer', id: c.id });
        toast('تم إنشاء الحساب بنجاح');
        renderApp();
      };
      document.getElementById('goLogin').onclick = function(){ renderAuth('login'); };
    }
  }

  function renderLoginForm(){
    return '<div class="gs-field" style="text-align:right"><label>رقم الهاتف</label><input class="gs-input" id="loginPhone" placeholder="07XXXXXXXX"></div>'+
      '<div class="gs-field" style="text-align:right"><label>كلمة المرور</label><input class="gs-input" type="password" id="loginPass"></div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="loginBtn">تسجيل الدخول</button>'+
      '<div style="margin-top:14px;font-size:13px;">ليس لديكِ حساب؟ <button class="gs-link-btn" id="goSignup">إنشاء حساب</button></div>'+
      '<div style="margin-top:10px;font-size:11.5px;color:var(--gs-muted)">للتجربة: 0790000001 / 123456</div>';
  }
  function renderSignupForm(){
    return '<div class="gs-field" style="text-align:right"><label>الاسم الكامل</label><input class="gs-input" id="suName"></div>'+
      '<div class="gs-field" style="text-align:right"><label>رقم الهاتف</label><input class="gs-input" id="suPhone" placeholder="07XXXXXXXX"></div>'+
      '<div class="gs-field" style="text-align:right"><label>كلمة المرور</label><input class="gs-input" type="password" id="suPass"></div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="signupBtn">إنشاء حساب</button>'+
      '<div style="margin-top:14px;font-size:13px;">لديكِ حساب؟ <button class="gs-link-btn" id="goLogin">تسجيل الدخول</button></div>';
  }

  /* ---------------- APP SHELL ---------------- */
  function renderApp(){
    var cust = currentCustomer();
    if (!cust){ renderAuth('login'); return; }
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="gs-topbar"><div class="gs-logo">✨ GlowSpot<span>مرحباً '+esc(cust.name)+'</span></div>'+
      '<button class="gs-btn gs-btn-sm" style="background:rgba(255,255,255,.2);color:#fff" id="logoutBtn">خروج</button></div>'+
      '<div id="tabContent"></div>'+
      '<div class="gs-tabbar">'+
        tabBtn('explore','🔍','استكشاف')+
        tabBtn('appointments','📅','مواعيدي')+
        tabBtn('favorites','❤️','المفضلة')+
        tabBtn('profile','👤','حسابي')+
      '</div>';
    document.getElementById('logoutBtn').onclick = function(){ S.clearSession('customer'); renderAuth('login'); };
    Array.prototype.forEach.call(document.querySelectorAll('.gs-tabbar button'), function(b){
      b.onclick = function(){ state.tab = b.dataset.tab; renderApp(); };
    });
    renderTab(cust);
  }
  function tabBtn(tab,ic,label){
    return '<button class="'+(state.tab===tab?'active':'')+'" data-tab="'+tab+'"><span class="ic">'+ic+'</span>'+label+'</button>';
  }

  function renderTab(cust){
    var c = document.getElementById('tabContent');
    if (state.tab==='explore') c.innerHTML = renderExplore(cust);
    else if (state.tab==='appointments') c.innerHTML = renderAppointments(cust);
    else if (state.tab==='favorites') c.innerHTML = renderFavorites(cust);
    else if (state.tab==='profile') c.innerHTML = renderProfile(cust);
    bindTabEvents(cust);
  }

  /* ---------------- EXPLORE ---------------- */
  function renderExplore(cust){
    var centers = S.getAll(S.KEYS.centers).filter(function(c){ return c.status==='approved'; });
    if (state.exploreDept){
      centers = centers.filter(function(c){ return (c.departments||[]).indexOf(state.exploreDept)!==-1; });
    }
    if (state.search){
      var q = state.search.toLowerCase();
      centers = centers.filter(function(c){ return c.name.toLowerCase().indexOf(q)!==-1 || c.city.toLowerCase().indexOf(q)!==-1; });
    }
    var deptChips = S.DEPARTMENTS.map(function(d){
      return '<div class="gs-dept-chip '+(state.exploreDept===d.id?'active':'')+'" data-dept="'+d.id+'">'+
        '<div class="circle">'+deptIcon(d.id)+'</div><span>'+d.name+'</span></div>';
    }).join('');

    var featured = centers.slice().sort(function(a,b){ return (b.rating||0)-(a.rating||0); }).slice(0,6);
    var featuredHtml = featured.map(function(c){
      return '<div class="gs-hcard" data-center="'+c.id+'"><div class="cover">💅</div><div class="body">'+
        '<div class="title">'+esc(c.name)+'</div><div class="meta">'+esc(c.city)+' · '+stars(c.rating)+' '+(c.rating||0)+'</div>'+
        '</div></div>';
    }).join('') || '<div class="gs-empty">لا توجد مراكز بعد</div>';

    var listHtml = centers.map(function(c){
      return '<div class="gs-list-card" data-center="'+c.id+'"><div class="thumb">💇‍♀️</div>'+
        '<div style="flex:1"><div class="gs-flex-between"><b>'+esc(c.name)+'</b>'+
        '<button class="fav-btn '+(isFavCenter(cust,c.id)?'on':'')+'" data-favcenter="'+c.id+'">'+(isFavCenter(cust,c.id)?'❤️':'🤍')+'</button></div>'+
        '<div style="font-size:12.5px;color:var(--gs-muted)">'+esc(c.city)+' · '+stars(c.rating)+' '+(c.rating||0)+'</div>'+
        '<div style="margin-top:4px">'+(c.departments||[]).slice(0,3).map(function(d){return '<span class="gs-tag">'+S.deptName(d)+'</span>';}).join('')+'</div>'+
        '</div></div>';
    }).join('') || '<div class="gs-empty">لا توجد نتائج مطابقة</div>';

    return '<div class="gs-header-light">'+
      '<div class="gs-search"><span>🔎</span><input id="searchInput" placeholder="ابحثي عن مركز أو مدينة..." value="'+esc(state.search)+'"></div>'+
      '<div class="gs-shortcuts">'+
        shortcut('quickbook','⚡','حجز سريع')+
        shortcut('packages','🎁','الباقات')+
        shortcut('favorites','❤️','المفضلة')+
        shortcut('homeservice','🏠','خدمة منزلية')+
      '</div>'+
      '<div class="gs-banner"><h2>عروض هذا الأسبوع 💖</h2><p>احجزي موعدكِ الآن واستمتعي بتجربة عناية استثنائية</p></div>'+
      '</div>'+
      '<div class="gs-container" style="padding-top:6px">'+
      '<div class="gs-section-title">الأقسام</div>'+
      '<div class="gs-scroll-x">'+deptChips+'</div>'+
      '<div class="gs-section-title">مراكز مميزة</div>'+
      '<div class="gs-scroll-x">'+featuredHtml+'</div>'+
      '<div class="gs-section-title">'+(state.exploreDept? 'مراكز قسم '+S.deptName(state.exploreDept) : 'كل المراكز')+'</div>'+
      listHtml+
      '</div>';
  }
  function shortcut(action, ic, label){
    return '<div class="gs-shortcut" data-action="'+action+'"><div class="ic">'+ic+'</div>'+label+'</div>';
  }
  function deptIcon(id){
    var map = { hair:'💇‍♀️', makeup:'💄', nails:'💅', henna:'🌿', spa:'🧖‍♀️', steam:'♨️', beauty:'✨', cupping:'🩹' };
    return map[id] || '💫';
  }
  function isFavCenter(cust, id){ return (cust.favorites||[]).indexOf(id)!==-1; }
  function isFavExpert(cust, id){ return (cust.favoriteExperts||[]).indexOf(id)!==-1; }

  function bindTabEvents(cust){
    if (state.tab==='explore'){
      var si = document.getElementById('searchInput');
      if (si) si.oninput = function(){ state.search = si.value; renderTab(cust); si.focus(); si.setSelectionRange(si.value.length, si.value.length); };
      Array.prototype.forEach.call(document.querySelectorAll('[data-dept]'), function(el){
        el.onclick = function(){ state.exploreDept = (state.exploreDept===el.dataset.dept)? null : el.dataset.dept; renderTab(cust); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-center]'), function(el){
        el.onclick = function(){ openCenterDetail(el.dataset.center, cust); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-favcenter]'), function(el){
        el.onclick = function(e){ e.stopPropagation(); toggleFavCenter(cust, el.dataset.favcenter); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-action]'), function(el){
        el.onclick = function(){
          var a = el.dataset.action;
          if (a==='quickbook') openQuickBooking(cust);
          else if (a==='packages') openAllPackages(cust);
          else if (a==='favorites'){ state.tab='favorites'; renderApp(); }
          else if (a==='homeservice') openHomeServiceCenters(cust);
        };
      });
    }
    if (state.tab==='appointments'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-cancel]'), function(el){
        el.onclick = function(){ cancelBooking(el.dataset.cancel, cust); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-review]'), function(el){
        el.onclick = function(){ openReviewModal(el.dataset.review, cust); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-altbooking]'), function(el){
        el.onclick = function(){ openAlternatives(el.dataset.altbooking, cust); };
      });
    }
    if (state.tab==='favorites'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-center]'), function(el){
        el.onclick = function(){ openCenterDetail(el.dataset.center, cust); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-expert]'), function(el){
        el.onclick = function(){ openExpertDetail(el.dataset.expert, cust); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-unfavcenter]'), function(el){
        el.onclick = function(e){ e.stopPropagation(); toggleFavCenter(cust, el.dataset.unfavcenter); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-unfavexpert]'), function(el){
        el.onclick = function(e){ e.stopPropagation(); toggleFavExpert(cust, el.dataset.unfavexpert); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('.gs-subtab'), function(el){
        el.onclick = function(){ state.favSub = el.dataset.sub; renderTab(cust); };
      });
    }
    if (state.tab==='profile'){
      document.getElementById('saveProfile').onclick = function(){
        var name = document.getElementById('pfName').value.trim();
        var phone = document.getElementById('pfPhone').value.trim();
        if (!name || !phone){ toast('يرجى تعبئة الحقول'); return; }
        S.update(S.KEYS.customers, cust.id, { name:name, phone:phone });
        toast('تم حفظ التعديلات');
        renderApp();
      };
    }
  }

  function toggleFavCenter(cust, id){
    var favs = cust.favorites||[];
    if (favs.indexOf(id)!==-1) favs = favs.filter(function(x){return x!==id;});
    else favs.push(id);
    S.update(S.KEYS.customers, cust.id, { favorites: favs });
    renderTab(S.getById(S.KEYS.customers, cust.id));
  }
  function toggleFavExpert(cust, id){
    var favs = cust.favoriteExperts||[];
    if (favs.indexOf(id)!==-1) favs = favs.filter(function(x){return x!==id;});
    else favs.push(id);
    S.update(S.KEYS.customers, cust.id, { favoriteExperts: favs });
    renderTab(S.getById(S.KEYS.customers, cust.id));
  }

  /* ---------------- APPOINTMENTS ---------------- */
  function renderAppointments(cust){
    var bookings = S.getAll(S.KEYS.bookings).filter(function(b){ return b.customerId===cust.id; })
      .sort(function(a,b){ return (b.date+b.time).localeCompare(a.date+a.time); });

    var now = new Date();
    var soon = bookings.filter(function(b){
      if (b.status!=='confirmed') return false;
      var dt = new Date(b.date+'T'+b.time);
      var diff = (dt-now)/3600000;
      return diff>0 && diff<=24;
    });

    var reminderHtml = soon.length ? '<div class="gs-reminder">⏰ لديكِ موعد قريب خلال 24 ساعة: '+esc(soon[0].service)+' الساعة '+soon[0].time+'</div>' : '';

    var reviews = S.getAll(S.KEYS.reviews);
    var itemsHtml = bookings.map(function(b){
      var hasReview = reviews.some(function(r){ return r.bookingId===b.id; });
      var actions = '';
      if (b.status==='pending' || b.status==='confirmed'){
        actions += '<button class="gs-btn gs-btn-sm gs-btn-danger" data-cancel="'+b.id+'">إلغاء</button>';
      }
      if (b.status==='completed' && !hasReview){
        actions += '<button class="gs-btn gs-btn-sm gs-btn-outline" data-review="'+b.id+'">تقييم</button>';
      }
      if (b.status==='declined'){
        actions += '<div class="gs-alert gs-alert-danger" style="margin:8px 0 0">سبب الرفض: '+esc(b.declineReason||'-')+'</div>';
        if (b.alternatives && b.alternatives.length){
          actions += '<button class="gs-btn gs-btn-sm gs-btn-primary" data-altbooking="'+b.id+'">عرض البدائل المقترحة</button>';
        }
      }
      return '<div class="gs-card" style="margin-bottom:12px">'+
        '<div class="gs-flex-between"><b>'+esc(b.service)+'</b><span class="gs-badge gs-badge-'+b.status+'">'+statusLabel(b.status)+'</span></div>'+
        '<div style="font-size:12.5px;color:var(--gs-muted);margin-top:4px">'+esc(b.centerName||'')+' · '+S.deptName(b.department)+'</div>'+
        '<div style="font-size:13px;margin-top:6px">📅 '+b.date+' &nbsp; ⏰ '+b.time+' &nbsp; 💰 '+b.price+' د.أ</div>'+
        '<div style="font-size:12.5px;color:var(--gs-muted)">الخبيرة: '+esc(b.expertName||'أي خبيرة متاحة')+'</div>'+
        (b.serviceLocation==='home' ? '<div style="font-size:12.5px;color:var(--gs-muted)">🏠 خدمة منزلية: '+esc(b.homeAddress||'')+'</div>' : '')+
        (actions ? '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+actions+'</div>' : '')+
        '</div>';
    }).join('') || '<div class="gs-empty">لا توجد مواعيد بعد</div>';

    return '<div class="gs-container">'+
      '<div class="gs-section-title">مواعيدي</div>'+
      reminderHtml+
      itemsHtml+
      '</div>';
  }
  function statusLabel(s){
    var m = { pending:'قيد الانتظار', confirmed:'مؤكد', in_service:'قيد التنفيذ', completed:'مكتمل', declined:'مرفوض', cancelled:'ملغي', no_show:'لم تحضر' };
    return m[s]||s;
  }

  function cancelBooking(id, cust){
    if (!confirm('هل تريدين إلغاء هذا الموعد؟')) return;
    S.update(S.KEYS.bookings, id, { status:'cancelled' });
    toast('تم إلغاء الموعد');
    renderTab(cust);
  }

  function openAlternatives(id, cust){
    var b = S.getById(S.KEYS.bookings, id);
    var html = (b.alternatives||[]).map(function(alt,i){
      return '<div class="gs-card" style="margin-bottom:8px"><div class="gs-flex-between"><span>📅 '+alt.date+' ⏰ '+alt.time+'</span>'+
        '<button class="gs-btn gs-btn-sm gs-btn-primary" data-pick="'+i+'">اختيار</button></div></div>';
    }).join('') || '<div class="gs-empty">لا توجد بدائل مقترحة</div>';
    showModal('البدائل المقترحة', html);
    Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function(el){
      el.onclick = function(){
        var alt = b.alternatives[parseInt(el.dataset.pick,10)];
        S.update(S.KEYS.bookings, id, { date:alt.date, time:alt.time, status:'pending', declineReason:null, alternatives:[] });
        closeModal();
        toast('تم إرسال طلب الحجز بالموعد الجديد');
        renderTab(cust);
      };
    });
  }

  function openReviewModal(bookingId, cust){
    var b = S.getById(S.KEYS.bookings, bookingId);
    var rating = 5;
    var html = '<div id="starsWrap" class="gs-review-stars">'+
      [1,2,3,4,5].map(function(i){ return '<span data-star="'+i+'" class="'+(i<=5?'active':'')+'">★</span>'; }).join('')+
      '</div><textarea class="gs-textarea" id="reviewComment" rows="4" placeholder="اكتبي تعليقكِ..."></textarea>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="submitReview" style="margin-top:12px">إرسال التقييم</button>';
    showModal('تقييم الخدمة: '+esc(b.service), html);
    function paint(){
      Array.prototype.forEach.call(document.querySelectorAll('#starsWrap span'), function(s){
        s.classList.toggle('active', parseInt(s.dataset.star,10)<=rating);
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('#starsWrap span'), function(s){
      s.onclick = function(){ rating = parseInt(s.dataset.star,10); paint(); };
    });
    document.getElementById('submitReview').onclick = function(){
      var comment = document.getElementById('reviewComment').value.trim();
      S.add(S.KEYS.reviews, {
        bookingId: b.id, centerId: b.centerId, expertId: b.expertId,
        customerId: cust.id, customerName: cust.name, rating: rating, comment: comment,
        createdAt: new Date().toISOString()
      });
      recalcRating(S.KEYS.experts, b.expertId);
      recalcRating(S.KEYS.centers, b.centerId);
      closeModal();
      toast('شكراً لتقييمكِ!');
      renderTab(S.getById(S.KEYS.customers, cust.id));
    };
  }
  function recalcRating(key, id){
    if (!id) return;
    var field = key===S.KEYS.experts ? 'expertId' : 'centerId';
    var reviews = S.getAll(S.KEYS.reviews).filter(function(r){ return r[field]===id; });
    if (!reviews.length) return;
    var avg = reviews.reduce(function(a,r){ return a+r.rating; },0)/reviews.length;
    S.update(key, id, { rating: Math.round(avg*10)/10 });
  }

  /* ---------------- FAVORITES ---------------- */
  function renderFavorites(cust){
    state.favSub = state.favSub || 'centers';
    var centers = S.getAll(S.KEYS.centers).filter(function(c){ return isFavCenter(cust,c.id); });
    var experts = S.getAll(S.KEYS.experts).filter(function(e){ return isFavExpert(cust,e.id); });
    var body = '';
    if (state.favSub==='centers'){
      body = centers.map(function(c){
        return '<div class="gs-list-card" data-center="'+c.id+'"><div class="thumb">💇‍♀️</div>'+
          '<div style="flex:1"><div class="gs-flex-between"><b>'+esc(c.name)+'</b>'+
          '<button class="fav-btn on" data-unfavcenter="'+c.id+'">❤️</button></div>'+
          '<div style="font-size:12.5px;color:var(--gs-muted)">'+esc(c.city)+' · '+stars(c.rating)+'</div></div></div>';
      }).join('') || '<div class="gs-empty">لا توجد مراكز مفضلة</div>';
    } else {
      body = experts.map(function(e){
        return '<div class="gs-list-card" data-expert="'+e.id+'"><div class="thumb">👩‍🦰</div>'+
          '<div style="flex:1"><div class="gs-flex-between"><b>'+esc(e.name)+'</b>'+
          '<button class="fav-btn on" data-unfavexpert="'+e.id+'">❤️</button></div>'+
          '<div style="font-size:12.5px;color:var(--gs-muted)">'+esc(e.specialty)+' · '+stars(e.rating)+'</div></div></div>';
      }).join('') || '<div class="gs-empty">لا توجد خبيرات مفضلة</div>';
    }
    return '<div class="gs-container">'+
      '<div class="gs-section-title">المفضلة</div>'+
      '<div class="gs-row" style="margin-bottom:14px">'+
      '<button class="gs-btn '+(state.favSub==='centers'?'gs-btn-primary':'gs-btn-muted')+' gs-subtab" data-sub="centers">المراكز</button>'+
      '<button class="gs-btn '+(state.favSub==='experts'?'gs-btn-primary':'gs-btn-muted')+' gs-subtab" data-sub="experts">الخبيرات</button>'+
      '</div>'+ body + '</div>';
  }

  /* ---------------- PROFILE ---------------- */
  function renderProfile(cust){
    return '<div class="gs-container">'+
      '<div class="gs-section-title">حسابي</div>'+
      '<div class="gs-card">'+
      '<div class="gs-field"><label>الاسم</label><input class="gs-input" id="pfName" value="'+esc(cust.name)+'"></div>'+
      '<div class="gs-field"><label>رقم الهاتف</label><input class="gs-input" id="pfPhone" value="'+esc(cust.phone)+'"></div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="saveProfile">حفظ التعديلات</button>'+
      '</div></div>';
  }

  /* ---------------- MODAL HELPERS ---------------- */
  function showModal(title, bodyHtml){
    document.getElementById('modalRoot').innerHTML =
      '<div class="gs-modal-backdrop" id="modalBackdrop"><div class="gs-modal">'+
      '<span class="gs-close" id="modalClose">✕</span><h3>'+esc(title)+'</h3>'+bodyHtml+
      '</div></div>';
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBackdrop').onclick = function(e){ if (e.target.id==='modalBackdrop') closeModal(); };
  }
  function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

  /* ---------------- CENTER / EXPERT DETAIL ---------------- */
  function openCenterDetail(centerId, cust){
    var c = S.getById(S.KEYS.centers, centerId);
    if (!c) return;
    var experts = S.getAll(S.KEYS.experts).filter(function(e){ return e.centerId===centerId; });
    var packages = S.getAll(S.KEYS.packages).filter(function(p){ return p.centerId===centerId; });
    var reviews = S.getAll(S.KEYS.reviews).filter(function(r){ return r.centerId===centerId; });

    var expertsHtml = experts.map(function(e){
      return '<div class="gs-list-card" data-expertline="'+e.id+'"><div class="thumb">👩‍🦰</div>'+
        '<div style="flex:1"><b>'+esc(e.name)+'</b><div style="font-size:12px;color:var(--gs-muted)">'+esc(e.specialty)+' · '+S.deptName(e.department)+' · '+stars(e.rating)+'</div></div></div>';
    }).join('') || '<div class="gs-empty">لا يوجد خبيرات مسجلات</div>';

    var pkgHtml = packages.map(function(p){
      return '<div class="gs-card" style="margin-bottom:8px"><div class="gs-flex-between"><b>'+esc(p.name)+'</b><span>'+p.price+' د.أ</span></div>'+
        '<div style="font-size:12px;color:var(--gs-muted);margin-top:4px">'+(p.items||[]).join(' + ')+'</div>'+
        '<button class="gs-btn gs-btn-sm gs-btn-primary" style="margin-top:8px" data-bookpkg="'+p.id+'">احجزي هذه الباقة</button></div>';
    }).join('') || '<div class="gs-empty">لا توجد باقات</div>';

    var reviewsHtml = reviews.slice(-5).reverse().map(function(r){
      return '<div style="border-bottom:1px solid var(--gs-border);padding:8px 0"><b>'+esc(r.customerName)+'</b> '+stars(r.rating)+
        '<div style="font-size:12.5px;color:var(--gs-muted)">'+esc(r.comment||'')+'</div></div>';
    }).join('') || '<div class="gs-empty">لا توجد تقييمات بعد</div>';

    var html = '<div class="gs-flex-between"><div style="font-size:13px;color:var(--gs-muted)">'+esc(c.city)+' · '+stars(c.rating)+' '+(c.rating||0)+'</div>'+
      '<button class="fav-btn '+(isFavCenter(cust,c.id)?'on':'')+'" id="detFav">'+(isFavCenter(cust,c.id)?'❤️':'🤍')+'</button></div>'+
      '<p style="font-size:13px;color:#555">'+esc(c.about||'')+'</p>'+
      '<div style="margin-bottom:10px">'+(c.departments||[]).map(function(d){return '<span class="gs-tag">'+S.deptName(d)+'</span>';}).join('')+'</div>'+
      (c.homeService ? '<div class="gs-alert gs-alert-info">🏠 هذا المركز يقدم الخدمة المنزلية</div>' : '')+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="bookGeneral" style="margin-bottom:14px">احجزي موعداً</button>'+
      '<div class="gs-section-title" style="margin-top:8px">الخبيرات</div>'+ expertsHtml +
      '<div class="gs-section-title">الباقات</div>'+ pkgHtml +
      '<div class="gs-section-title">التقييمات</div>'+ reviewsHtml;

    showModal(c.name, html);
    document.getElementById('detFav').onclick = function(){ toggleFavCenter(cust, c.id); closeModal(); openCenterDetail(centerId, S.getById(S.KEYS.customers,cust.id)); };
    document.getElementById('bookGeneral').onclick = function(){ closeModal(); openBookingFlow({ mode:'general', center:c }, cust); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-expertline]'), function(el){
      el.onclick = function(){ closeModal(); openExpertDetail(el.dataset.expertline, cust); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-bookpkg]'), function(el){
      el.onclick = function(){ var p = S.getById(S.KEYS.packages, el.dataset.bookpkg); closeModal(); openBookingFlow({ mode:'package', center:c, pkg:p }, cust); };
    });
  }

  function openExpertDetail(expertId, cust){
    var e = S.getById(S.KEYS.experts, expertId);
    if (!e) return;
    var c = S.getById(S.KEYS.centers, e.centerId);
    var services = Object.keys(e.servicePrices||{});
    var svcHtml = services.map(function(s){
      return '<div class="gs-flex-between" style="padding:6px 0;border-bottom:1px solid var(--gs-border)">'+
        '<span>'+esc(s)+' <span style="color:var(--gs-muted);font-size:11.5px">('+(e.serviceDurations[s]||30)+' د)</span></span><b>'+e.servicePrices[s]+' د.أ</b></div>';
    }).join('') || '<div class="gs-empty">لا توجد خدمات مسجلة</div>';

    var html = '<div class="gs-flex-between"><div style="font-size:13px;color:var(--gs-muted)">'+esc(c?c.name:'')+' · '+stars(e.rating)+' '+(e.rating||0)+'</div>'+
      '<button class="fav-btn '+(isFavExpert(cust,e.id)?'on':'')+'" id="detFavExp">'+(isFavExpert(cust,e.id)?'❤️':'🤍')+'</button></div>'+
      '<p style="font-size:13px;color:#555">'+esc(e.specialty||'')+' · '+S.deptName(e.department)+'</p>'+
      (e.available===false ? '<div class="gs-alert gs-alert-warn">غير متاحة حالياً</div>' : '')+
      '<div class="gs-section-title" style="margin-top:4px">الخدمات والأسعار</div>'+ svcHtml +
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="bookExpert" style="margin-top:16px">احجزي مع '+esc(e.name)+'</button>';

    showModal(e.name, html);
    document.getElementById('detFavExp').onclick = function(){ toggleFavExpert(cust, e.id); closeModal(); openExpertDetail(expertId, S.getById(S.KEYS.customers,cust.id)); };
    document.getElementById('bookExpert').onclick = function(){ closeModal(); openBookingFlow({ mode:'expert', center:c, expert:e }, cust); };
  }

  /* ---------------- QUICK BOOKING / PACKAGES / HOME SERVICE ---------------- */
  function openQuickBooking(cust){
    var deptHtml = S.DEPARTMENTS.map(function(d){
      return '<div class="gs-dept-chip" data-qdept="'+d.id+'"><div class="circle">'+deptIcon(d.id)+'</div><span>'+d.name+'</span></div>';
    }).join('');
    showModal('حجز سريع - اختاري القسم', '<div class="gs-scroll-x" style="flex-wrap:wrap">'+deptHtml+'</div>');
    Array.prototype.forEach.call(document.querySelectorAll('[data-qdept]'), function(el){
      el.onclick = function(){
        var dept = el.dataset.qdept;
        var centers = S.getAll(S.KEYS.centers).filter(function(c){ return c.status==='approved' && (c.departments||[]).indexOf(dept)!==-1; });
        var html = centers.map(function(c){
          return '<div class="gs-list-card" data-qcenter="'+c.id+'"><div class="thumb">'+deptIcon(dept)+'</div>'+
            '<div><b>'+esc(c.name)+'</b><div style="font-size:12px;color:var(--gs-muted)">'+esc(c.city)+' · '+stars(c.rating)+'</div></div></div>';
        }).join('') || '<div class="gs-empty">لا توجد مراكز لهذا القسم</div>';
        showModal('اختاري المركز', html);
        Array.prototype.forEach.call(document.querySelectorAll('[data-qcenter]'), function(el2){
          el2.onclick = function(){ var c = S.getById(S.KEYS.centers, el2.dataset.qcenter); closeModal(); openBookingFlow({ mode:'general', center:c, department:dept }, cust); };
        });
      };
    });
  }

  function openAllPackages(cust){
    var packages = S.getAll(S.KEYS.packages);
    var html = packages.map(function(p){
      var c = S.getById(S.KEYS.centers, p.centerId);
      return '<div class="gs-card" style="margin-bottom:10px"><div class="gs-flex-between"><b>'+esc(p.name)+'</b><span>'+p.price+' د.أ</span></div>'+
        '<div style="font-size:12px;color:var(--gs-muted)">'+esc(c?c.name:'')+'</div>'+
        '<div style="font-size:12.5px;margin-top:4px">'+(p.items||[]).join(' + ')+'</div>'+
        '<button class="gs-btn gs-btn-sm gs-btn-primary" style="margin-top:8px" data-pkgall="'+p.id+'">احجزي</button></div>';
    }).join('') || '<div class="gs-empty">لا توجد باقات متاحة حالياً</div>';
    showModal('كل الباقات', html);
    Array.prototype.forEach.call(document.querySelectorAll('[data-pkgall]'), function(el){
      el.onclick = function(){
        var p = S.getById(S.KEYS.packages, el.dataset.pkgall);
        var c = S.getById(S.KEYS.centers, p.centerId);
        closeModal();
        openBookingFlow({ mode:'package', center:c, pkg:p }, cust);
      };
    });
  }

  function openHomeServiceCenters(cust){
    var centers = S.getAll(S.KEYS.centers).filter(function(c){ return c.status==='approved' && c.homeService; });
    var html = centers.map(function(c){
      return '<div class="gs-list-card" data-hcenter="'+c.id+'"><div class="thumb">🏠</div>'+
        '<div><b>'+esc(c.name)+'</b><div style="font-size:12px;color:var(--gs-muted)">'+esc(c.city)+' · '+stars(c.rating)+'</div></div></div>';
    }).join('') || '<div class="gs-empty">لا توجد مراكز تقدم الخدمة المنزلية حالياً</div>';
    showModal('الخدمة المنزلية', html);
    Array.prototype.forEach.call(document.querySelectorAll('[data-hcenter]'), function(el){
      el.onclick = function(){ closeModal(); openCenterDetail(el.dataset.hcenter, cust); };
    });
  }

  /* ---------------- BOOKING FLOW ---------------- */
  function openBookingFlow(ctx, cust){
    state.booking = Object.assign({ location:'center' }, ctx);
    if (ctx.mode==='package') return bookingStepDateTimePackage(cust);
    if (ctx.mode==='expert') return bookingStepService(cust);
    return bookingStepDepartment(cust);
  }

  function bookingStepDepartment(cust){
    var b = state.booking;
    var depts = b.department ? [b.department] : (b.center.departments||[]);
    if (depts.length===1){ b.department = depts[0]; return bookingStepServiceGeneral(cust); }
    var html = depts.map(function(d){
      return '<div class="gs-dept-chip" data-bdept="'+d+'"><div class="circle">'+deptIcon(d)+'</div><span>'+S.deptName(d)+'</span></div>';
    }).join('');
    showModal('اختاري القسم', '<div class="gs-scroll-x" style="flex-wrap:wrap">'+html+'</div>');
    Array.prototype.forEach.call(document.querySelectorAll('[data-bdept]'), function(el){
      el.onclick = function(){ b.department = el.dataset.bdept; bookingStepServiceGeneral(cust); };
    });
  }

  function servicesForDeptAtCenter(centerId, dept){
    var experts = S.getAll(S.KEYS.experts).filter(function(e){ return e.centerId===centerId && e.department===dept; });
    var services = {};
    experts.forEach(function(e){
      Object.keys(e.servicePrices||{}).forEach(function(s){
        if (!services[s]) services[s] = { price: e.servicePrices[s], duration: e.serviceDurations[s]||30 };
      });
    });
    return services;
  }

  function bookingStepServiceGeneral(cust){
    var b = state.booking;
    var services = servicesForDeptAtCenter(b.center.id, b.department);
    var keys = Object.keys(services);
    if (!keys.length){ closeModal(); toast('لا توجد خدمات متاحة لهذا القسم حالياً'); return; }
    var html = keys.map(function(s){
      return '<div class="gs-list-card" data-svc="'+esc(s)+'"><div style="flex:1"><b>'+esc(s)+'</b>'+
        '<div style="font-size:12px;color:var(--gs-muted)">'+services[s].duration+' دقيقة</div></div><b>'+services[s].price+' د.أ</b></div>';
    }).join('');
    showModal('اختاري الخدمة', html);
    Array.prototype.forEach.call(document.querySelectorAll('[data-svc]'), function(el){
      el.onclick = function(){
        b.service = el.dataset.svc;
        b.price = services[b.service].price;
        b.duration = services[b.service].duration;
        bookingStepLocation(cust);
      };
    });
  }

  function bookingStepService(cust){
    var b = state.booking;
    var e = b.expert;
    var services = e.servicePrices||{};
    var keys = Object.keys(services);
    var html = keys.map(function(s){
      return '<div class="gs-list-card" data-svc="'+esc(s)+'"><div style="flex:1"><b>'+esc(s)+'</b>'+
        '<div style="font-size:12px;color:var(--gs-muted)">'+(e.serviceDurations[s]||30)+' دقيقة</div></div><b>'+services[s]+' د.أ</b></div>';
    }).join('');
    showModal('اختاري الخدمة مع '+e.name, html);
    Array.prototype.forEach.call(document.querySelectorAll('[data-svc]'), function(el){
      el.onclick = function(){
        b.service = el.dataset.svc;
        b.price = services[b.service];
        b.duration = e.serviceDurations[b.service]||30;
        b.department = e.department;
        bookingStepLocation(cust);
      };
    });
  }

  function bookingStepLocation(cust){
    var b = state.booking;
    if (!b.center.homeService){ b.location='center'; return bookingStepDate(cust); }
    var html = '<div class="gs-row" style="margin-bottom:14px">'+
      '<button class="gs-btn gs-btn-outline gs-btn-block" id="locCenter">في المركز</button>'+
      '<button class="gs-btn gs-btn-outline gs-btn-block" id="locHome">خدمة منزلية 🏠</button></div>'+
      '<div class="gs-field" id="addrField" style="display:none"><label>العنوان</label><input class="gs-input" id="homeAddr"></div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="locNext">التالي</button>';
    showModal('مكان الخدمة', html);
    var loc = 'center';
    document.getElementById('locCenter').onclick = function(){ loc='center'; document.getElementById('addrField').style.display='none'; };
    document.getElementById('locHome').onclick = function(){ loc='home'; document.getElementById('addrField').style.display='block'; };
    document.getElementById('locNext').onclick = function(){
      b.location = loc;
      if (loc==='home') b.homeAddress = document.getElementById('homeAddr').value.trim();
      bookingStepDate(cust);
    };
  }

  function bookingStepDate(cust){
    var b = state.booking;
    var today = new Date();
    var options = [];
    for (var i=0;i<10;i++){ var d = new Date(today); d.setDate(d.getDate()+i); options.push(d.toISOString().slice(0,10)); }
    var html = '<div class="gs-field"><label>اختاري التاريخ</label><select class="gs-select" id="dateSelect">'+
      options.map(function(d){ return '<option value="'+d+'">'+d+'</option>'; }).join('')+'</select></div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="dateNext">عرض الأوقات المتاحة</button>'+
      '<div id="slotArea" style="margin-top:14px"></div>';
    showModal('اختاري الموعد', html);
    document.getElementById('dateNext').onclick = function(){
      b.date = document.getElementById('dateSelect').value;
      renderSlots(cust);
    };
  }

  function candidateExperts(){
    var b = state.booking;
    if (b.mode==='expert') return [b.expert];
    return S.getAll(S.KEYS.experts).filter(function(e){
      return e.centerId===b.center.id && e.department===b.department && e.available!==false;
    });
  }

  function renderSlots(cust){
    var b = state.booking;
    var experts = candidateExperts();
    var slotMap = {}; // time -> expertId
    experts.forEach(function(e){
      S.generateSlots(e, b.date, b.duration).forEach(function(t){
        if (!slotMap[t]) slotMap[t] = e.id;
      });
    });
    var times = Object.keys(slotMap).sort();
    var area = document.getElementById('slotArea');
    if (!times.length){ area.innerHTML = '<div class="gs-empty">لا توجد أوقات متاحة في هذا اليوم</div>'; return; }
    area.innerHTML = '<div class="gs-slot-grid">'+times.map(function(t){
      return '<div class="gs-slot" data-time="'+t+'">'+t+'</div>';
    }).join('')+'</div><button class="gs-btn gs-btn-primary gs-btn-block" id="slotNext" style="margin-top:14px" disabled>تأكيد الموعد</button>';
    var chosen = null;
    Array.prototype.forEach.call(document.querySelectorAll('.gs-slot'), function(el){
      el.onclick = function(){
        Array.prototype.forEach.call(document.querySelectorAll('.gs-slot'), function(x){ x.classList.remove('selected'); });
        el.classList.add('selected');
        chosen = el.dataset.time;
        document.getElementById('slotNext').disabled = false;
      };
    });
    document.getElementById('slotNext').onclick = function(){
      b.time = chosen;
      b.expertId = slotMap[chosen];
      var e = S.getById(S.KEYS.experts, b.expertId);
      b.expertName = e ? e.name : null;
      confirmBooking(cust);
    };
  }

  function bookingStepDateTimePackage(cust){
    var b = state.booking;
    b.service = b.pkg.name;
    b.price = b.pkg.price;
    b.duration = 60;
    b.department = null;
    var today = new Date();
    var options = [];
    for (var i=0;i<10;i++){ var d = new Date(today); d.setDate(d.getDate()+i); options.push(d.toISOString().slice(0,10)); }
    var times = ['10:00','11:00','12:00','13:00','15:00','16:00','17:00','18:00'];
    var html = '<div class="gs-field"><label>اختاري التاريخ</label><select class="gs-select" id="pkgDate">'+
      options.map(function(d){return '<option value="'+d+'">'+d+'</option>';}).join('')+'</select></div>'+
      '<div class="gs-field"><label>اختاري الوقت التقريبي</label><select class="gs-select" id="pkgTime">'+
      times.map(function(t){return '<option value="'+t+'">'+t+'</option>';}).join('')+'</select></div>'+
      '<div class="gs-alert gs-alert-info">سيتم تأكيد الموعد وتخصيص خبيرة مناسبة من قبل المركز.</div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="pkgNext">تأكيد طلب الباقة</button>';
    showModal('حجز باقة: '+b.pkg.name, html);
    document.getElementById('pkgNext').onclick = function(){
      b.date = document.getElementById('pkgDate').value;
      b.time = document.getElementById('pkgTime').value;
      b.expertId = null; b.expertName = null;
      confirmBooking(cust);
    };
  }

  function confirmBooking(cust){
    var b = state.booking;
    S.add(S.KEYS.bookings, {
      centerId: b.center.id,
      centerName: b.center.name,
      department: b.department,
      service: b.service,
      expertId: b.expertId || null,
      expertName: b.expertName || null,
      customerId: cust.id,
      customerName: cust.name,
      phone: cust.phone,
      date: b.date,
      time: b.time,
      duration: b.duration,
      price: b.price,
      status: 'pending',
      serviceLocation: b.location || 'center',
      homeAddress: b.homeAddress || null,
      declineReason: null,
      alternatives: []
    });
    closeModal();
    toast('تم إرسال طلب الحجز بنجاح، بانتظار التأكيد');
    state.tab = 'appointments';
    renderApp();
  }

  /* ---------------- INIT ---------------- */
  renderApp();
})();
</script>
</body>
</html>
