databases:
  - name: glowspot-db
    plan: free
    databaseName: glowspot
    user: glowspot

services:
  - type: web
    name: glowspot-server
    runtime: node
    plan: free
    rootDir: GlowSpot-Project/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glowspot-db
          property: connectionString
      - key: GLOWSPOT_JWT_SECRET
        generateValue: true
      - key: GLOWSPOT_ADMIN_PASSWORD
        sync: false
