<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowSpot - لوحة الخبيرة</title>
<link rel="stylesheet" href="glowspot-style.css">
<style>
  #app{padding-bottom:40px;}
  .gs-navlinks{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--gs-border);position:sticky;top:56px;z-index:40;}
  .gs-navlinks button{white-space:nowrap;border:none;background:#f8f1f4;color:#555;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .gs-navlinks button.active{background:linear-gradient(135deg,var(--gs-primary),var(--gs-secondary));color:#fff;}
  .gs-day-col{min-width:120px;background:#fff;border:1px solid var(--gs-border);border-radius:12px;padding:10px;}
  .gs-day-col h4{margin:0 0 8px;font-size:13px;}
  .gs-day-slot{font-size:12px;padding:6px;border-radius:8px;background:#fdf3f7;margin-bottom:6px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="gs-toast"></div>

<script src="glowspot-storage.js"></script>
<script>
(function(){
  'use strict';
  var S = window.storage;
  var state = { tab:'today' };
  var WEEKDAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200); }
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function statusLabel(s){ var m={pending:'قيد الانتظار',confirmed:'مؤكد',in_service:'قيد التنفيذ',completed:'مكتمل',declined:'مرفوض',cancelled:'ملغي',no_show:'لم تحضر'}; return m[s]||s; }
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function currentExpert(){
    var sess = S.getSession('expert');
    if (!sess || sess.role!=='expert') return null;
    return S.getById(S.KEYS.experts, sess.id);
  }

  function renderLogin(){
    document.getElementById('app').innerHTML =
      '<div class="gs-login-wrap"><div class="gs-login-card">'+
      '<div class="gs-logo-big">✨ GlowSpot</div><div class="gs-tag">لوحة الخبيرة</div>'+
      '<div class="gs-field" style="text-align:right"><label>رقم الهاتف</label><input class="gs-input" id="loginPhone"></div>'+
      '<div class="gs-field" style="text-align:right"><label>كلمة المرور</label><input class="gs-input" type="password" id="loginPass"></div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="loginBtn">دخول</button>'+
      '<div style="margin-top:10px;font-size:11.5px;color:var(--gs-muted)">للتجربة: 0920000001 / expert123</div>'+
      '</div></div>';
    document.getElementById('loginBtn').onclick = function(){
      var phone = document.getElementById('loginPhone').value.trim();
      var pass = document.getElementById('loginPass').value;
      var e = S.getAll(S.KEYS.experts).filter(function(x){ return x.phone===phone && x.password===pass; })[0];
      if (!e){ toast('بيانات الدخول غير صحيحة'); return; }
      S.setSession({ role:'expert', id:e.id });
      renderApp();
    };
  }

  function renderApp(){
    var expert = currentExpert();
    if (!expert){ renderLogin(); return; }
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="gs-topbar"><div class="gs-logo">✨ GlowSpot<span>'+esc(expert.name)+'</span></div>'+
      '<button class="gs-btn gs-btn-sm" style="background:rgba(255,255,255,.2);color:#fff" id="logoutBtn">خروج</button></div>'+
      '<div class="gs-navlinks">'+
        navBtn('today','اليوم')+ navBtn('week','الأسبوع')+ navBtn('requests','الطلبات')+
        navBtn('prices','الأسعار')+ navBtn('hours','ساعات العمل')+ navBtn('notes','ملاحظات العميلات')+
        navBtn('reviews','التقييمات')+
      '</div>'+
      '<div id="tabContent" class="gs-container"></div>';
    document.getElementById('logoutBtn').onclick = function(){ S.clearSession('expert'); renderLogin(); };
    Array.prototype.forEach.call(document.querySelectorAll('.gs-navlinks button'), function(b){
      b.onclick = function(){ state.tab=b.dataset.tab; renderApp(); };
    });
    renderTab(expert);
  }
  function navBtn(tab,label){ return '<button class="'+(state.tab===tab?'active':'')+'" data-tab="'+tab+'">'+label+'</button>'; }

  function renderTab(expert){
    var c = document.getElementById('tabContent');
    if (state.tab==='today') c.innerHTML = renderToday(expert);
    else if (state.tab==='week') c.innerHTML = renderWeek(expert);
    else if (state.tab==='requests') c.innerHTML = renderRequests(expert);
    else if (state.tab==='prices') c.innerHTML = renderPrices(expert);
    else if (state.tab==='hours') c.innerHTML = renderHours(expert);
    else if (state.tab==='notes') c.innerHTML = renderNotes(expert);
    else if (state.tab==='reviews') c.innerHTML = renderReviews(expert);
    bindEvents(expert);
  }

  function bookingCard(b, actions){
    return '<div class="gs-card" style="margin-bottom:10px"><div class="gs-flex-between"><b>'+esc(b.service)+'</b><span class="gs-badge gs-badge-'+b.status+'">'+statusLabel(b.status)+'</span></div>'+
      '<div style="font-size:12.5px;color:var(--gs-muted)">'+esc(b.customerName)+' · '+esc(b.phone)+'</div>'+
      '<div style="font-size:13px;margin-top:4px">📅 '+b.date+' ⏰ '+b.time+' ('+b.duration+' د) · 💰 '+b.price+' د.أ</div>'+
      (b.serviceLocation==='home' ? '<div style="font-size:12px;color:var(--gs-muted)">🏠 '+esc(b.homeAddress||'')+'</div>' : '')+
      (actions ? '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+actions+'</div>' : '')+
      '</div>';
  }

  /* ---------------- TODAY ---------------- */
  function renderToday(expert){
    var d = todayStr();
    var bookings = S.getAll(S.KEYS.bookings).filter(function(b){ return b.expertId===expert.id && b.date===d && b.status!=='declined' && b.status!=='cancelled'; })
      .sort(function(a,b){ return a.time.localeCompare(b.time); });
    var rows = bookings.map(function(b){
      var actions = '';
      if (b.status==='confirmed') actions += '<button class="gs-btn gs-btn-sm gs-btn-primary" data-start="'+b.id+'">بدء الخدمة</button>';
      if (b.status==='in_service') actions += '<button class="gs-btn gs-btn-sm gs-btn-success" data-complete="'+b.id+'">إنهاء الخدمة</button>';
      if (b.status==='confirmed' || b.status==='in_service') actions += '<button class="gs-btn gs-btn-sm gs-btn-muted" data-noshow="'+b.id+'">لم تحضر</button>';
      return bookingCard(b, actions);
    }).join('') || '<div class="gs-empty">لا توجد مواعيد اليوم</div>';
    return '<div class="gs-section-title">مواعيد اليوم ('+d+')</div>'+rows;
  }

  /* ---------------- WEEK ---------------- */
  function renderWeek(expert){
    var start = new Date();
    var cols = '';
    for (var i=0;i<7;i++){
      var d = new Date(start); d.setDate(d.getDate()+i);
      var ds = d.toISOString().slice(0,10);
      var dow = d.getDay();
      var bookings = S.getAll(S.KEYS.bookings).filter(function(b){ return b.expertId===expert.id && b.date===ds && b.status!=='declined' && b.status!=='cancelled'; })
        .sort(function(a,b){ return a.time.localeCompare(b.time); });
      cols += '<div class="gs-day-col"><h4>'+WEEKDAYS[dow]+'<br><span style="color:var(--gs-muted);font-weight:400">'+ds+'</span></h4>'+
        (bookings.map(function(b){ return '<div class="gs-day-slot">'+b.time+' - '+esc(b.service)+'</div>'; }).join('') || '<div style="font-size:11.5px;color:var(--gs-muted)">لا مواعيد</div>')+
        '</div>';
    }
    return '<div class="gs-section-title">التقويم الأسبوعي</div><div class="gs-scroll-x">'+cols+'</div>';
  }

  /* ---------------- REQUESTS ---------------- */
  function renderRequests(expert){
    var bookings = S.getAll(S.KEYS.bookings).filter(function(b){ return b.expertId===expert.id && b.status==='pending'; })
      .sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
    var rows = bookings.map(function(b){
      var actions = '<button class="gs-btn gs-btn-sm gs-btn-success" data-accept="'+b.id+'">قبول</button>'+
        '<button class="gs-btn gs-btn-sm gs-btn-danger" data-decline="'+b.id+'">رفض</button>';
      return bookingCard(b, actions);
    }).join('') || '<div class="gs-empty">لا توجد طلبات جديدة</div>';
    return '<div class="gs-section-title">طلبات الحجز</div>'+rows;
  }

  function openDeclineModal(expert, bookingId){
    var html = '<div class="gs-field"><label>سبب الرفض</label><textarea class="gs-textarea" id="declineReason" rows="3"></textarea></div>'+
      '<div class="gs-field"><label>اقتراح موعد بديل 1 (اختياري)</label><div class="gs-row">'+
      '<input type="date" class="gs-input" id="altDate1"><input type="time" class="gs-input" id="altTime1"></div></div>'+
      '<div class="gs-field"><label>اقتراح موعد بديل 2 (اختياري)</label><div class="gs-row">'+
      '<input type="date" class="gs-input" id="altDate2"><input type="time" class="gs-input" id="altTime2"></div></div>'+
      '<button class="gs-btn gs-btn-danger gs-btn-block" id="confirmDecline">تأكيد الرفض</button>';
    showModal('رفض الحجز', html);
    document.getElementById('confirmDecline').onclick = function(){
      var reason = document.getElementById('declineReason').value.trim();
      if (!reason){ toast('يرجى كتابة سبب الرفض'); return; }
      var alts = [];
      var d1=document.getElementById('altDate1').value, t1=document.getElementById('altTime1').value;
      var d2=document.getElementById('altDate2').value, t2=document.getElementById('altTime2').value;
      if (d1 && t1) alts.push({date:d1, time:t1});
      if (d2 && t2) alts.push({date:d2, time:t2});
      S.update(S.KEYS.bookings, bookingId, { status:'declined', declineReason:reason, alternatives:alts });
      closeModal(); toast('تم رفض الحجز'); renderTab(expert);
    };
  }

  /* ---------------- PRICES ---------------- */
  function renderPrices(expert){
    var services = Object.keys(expert.servicePrices||{});
    var rows = services.map(function(s){
      return '<div class="gs-flex-between" style="padding:8px 0;border-bottom:1px solid var(--gs-border)">'+
        '<span>'+esc(s)+'</span>'+
        '<div class="gs-row" style="max-width:220px">'+
        '<input class="gs-input" type="number" data-priceof="'+esc(s)+'" value="'+expert.servicePrices[s]+'" placeholder="السعر">'+
        '<input class="gs-input" type="number" data-durof="'+esc(s)+'" value="'+(expert.serviceDurations[s]||30)+'" placeholder="الدقائق">'+
        '</div></div>';
    }).join('') || '<div class="gs-empty">لا توجد خدمات مسجلة</div>';
    return '<div class="gs-section-title">الأسعار والمدد</div>'+
      '<div class="gs-card">'+rows+
      '<div class="gs-field" style="margin-top:14px"><label>إضافة خدمة جديدة</label><div class="gs-row">'+
      '<input class="gs-input" id="newSvcName" placeholder="اسم الخدمة">'+
      '<input class="gs-input" id="newSvcPrice" type="number" placeholder="السعر">'+
      '<input class="gs-input" id="newSvcDur" type="number" placeholder="الدقائق"></div>'+
      '<button class="gs-btn gs-btn-outline gs-btn-block" id="addSvcBtn" style="margin-top:8px">+ إضافة</button></div>'+
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="savePrices" style="margin-top:14px">حفظ التعديلات</button></div>';
  }

  /* ---------------- WORKING HOURS ---------------- */
  function renderHours(expert){
    var wh = expert.workingHours||{};
    var rows = WEEKDAYS.map(function(name, i){
      var d = wh[i] || {};
      return '<div class="gs-card" style="margin-bottom:10px"><b>'+name+'</b>'+
        '<div class="gs-row" style="margin-top:8px">'+
        '<div class="gs-field"><label>من</label><input type="time" class="gs-input" data-whstart="'+i+'" value="'+(d.start||'')+'"></div>'+
        '<div class="gs-field"><label>إلى</label><input type="time" class="gs-input" data-whend="'+i+'" value="'+(d.end||'')+'"></div></div>'+
        '<div class="gs-row"><div class="gs-field"><label>بداية الاستراحة</label><input type="time" class="gs-input" data-brstart="'+i+'" value="'+(d.breakStart||'')+'"></div>'+
        '<div class="gs-field"><label>نهاية الاستراحة</label><input type="time" class="gs-input" data-brend="'+i+'" value="'+(d.breakEnd||'')+'"></div></div></div>';
    }).join('');

    var leaves = (expert.leaveRequests||[]).map(function(lr,i){
      return '<div class="gs-card" style="margin-bottom:8px"><div class="gs-flex-between"><span>من '+lr.from+' إلى '+lr.to+'</span>'+
        '<button class="gs-btn gs-btn-sm gs-btn-danger" data-delleave="'+i+'">حذف</button></div></div>';
    }).join('') || '<div class="gs-empty">لا توجد طلبات إجازة</div>';

    return '<div class="gs-section-title">ساعات العمل</div>'+ rows +
      '<button class="gs-btn gs-btn-primary gs-btn-block" id="saveHours">حفظ ساعات العمل</button>'+
      '<div class="gs-section-title" style="margin-top:24px">طلبات الإجازة</div>'+ leaves +
      '<div class="gs-card"><div class="gs-row"><input type="date" class="gs-input" id="leaveFrom"><input type="date" class="gs-input" id="leaveTo"></div>'+
      '<button class="gs-btn gs-btn-outline gs-btn-block" id="addLeaveBtn" style="margin-top:8px">+ طلب إجازة</button></div>';
  }

  /* ---------------- CLIENT NOTES ---------------- */
  function renderNotes(expert){
    var bookings = S.getAll(S.KEYS.bookings).filter(function(b){ return b.expertId===expert.id; });
    var clientsMap = {};
    bookings.forEach(function(b){ clientsMap[b.customerId] = b.customerName; });
    var notes = expert.clientNotes||{};
    var rows = Object.keys(clientsMap).map(function(cid){
      return '<div class="gs-card" style="margin-bottom:10px"><b>'+esc(clientsMap[cid])+'</b>'+
        '<textarea class="gs-textarea" rows="2" data-note="'+cid+'" style="margin-top:8px" placeholder="أضيفي ملاحظة...">'+esc(notes[cid]||'')+'</textarea>'+
        '<button class="gs-btn gs-btn-sm gs-btn-outline" data-savenote="'+cid+'" style="margin-top:6px">حفظ</button></div>';
    }).join('') || '<div class="gs-empty">لا يوجد عميلات بعد</div>';
    return '<div class="gs-section-title">ملاحظات العميلات</div>'+rows;
  }

  /* ---------------- REVIEWS ---------------- */
  function renderReviews(expert){
    var reviews = S.getAll(S.KEYS.reviews).filter(function(r){ return r.expertId===expert.id; }).reverse();
    var rows = reviews.map(function(r){
      return '<div class="gs-card" style="margin-bottom:8px"><div class="gs-flex-between"><b>'+esc(r.customerName)+'</b>'+
        '<span class="gs-star">'+'★'.repeat(r.rating)+'</span></div>'+
        '<div style="font-size:12.5px;color:var(--gs-muted)">'+esc(r.comment||'')+'</div></div>';
    }).join('') || '<div class="gs-empty">لا توجد تقييمات بعد</div>';
    return '<div class="gs-section-title">التقييمات (متوسط: '+(expert.rating||0)+' ⭐)</div>'+rows;
  }

  /* ---------------- EVENTS ---------------- */
  function bindEvents(expert){
    if (state.tab==='today'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-start]'), function(el){ el.onclick=function(){ S.update(S.KEYS.bookings, el.dataset.start, {status:'in_service'}); renderTab(expert); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-complete]'), function(el){ el.onclick=function(){ S.update(S.KEYS.bookings, el.dataset.complete, {status:'completed'}); toast('تم إنهاء الخدمة'); renderTab(expert); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-noshow]'), function(el){ el.onclick=function(){ S.update(S.KEYS.bookings, el.dataset.noshow, {status:'no_show'}); renderTab(expert); }; });
    }
    if (state.tab==='requests'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-accept]'), function(el){ el.onclick=function(){ S.update(S.KEYS.bookings, el.dataset.accept, {status:'confirmed'}); toast('تم قبول الحجز'); renderTab(expert); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-decline]'), function(el){ el.onclick=function(){ openDeclineModal(expert, el.dataset.decline); }; });
    }
    if (state.tab==='prices'){
      var addBtn = document.getElementById('addSvcBtn');
      if (addBtn) addBtn.onclick = function(){
        var name = document.getElementById('newSvcName').value.trim();
        var price = parseFloat(document.getElementById('newSvcPrice').value)||0;
        var dur = parseInt(document.getElementById('newSvcDur').value,10)||30;
        if (!name){ toast('أدخلي اسم الخدمة'); return; }
        var prices = Object.assign({}, expert.servicePrices||{}); prices[name]=price;
        var durations = Object.assign({}, expert.serviceDurations||{}); durations[name]=dur;
        S.update(S.KEYS.experts, expert.id, { servicePrices:prices, serviceDurations:durations });
        toast('تمت الإضافة'); renderTab(S.getById(S.KEYS.experts, expert.id));
      };
      var saveBtn = document.getElementById('savePrices');
      if (saveBtn) saveBtn.onclick = function(){
        var prices = Object.assign({}, expert.servicePrices||{});
        var durations = Object.assign({}, expert.serviceDurations||{});
        Array.prototype.forEach.call(document.querySelectorAll('[data-priceof]'), function(el){ prices[el.dataset.priceof] = parseFloat(el.value)||0; });
        Array.prototype.forEach.call(document.querySelectorAll('[data-durof]'), function(el){ durations[el.dataset.durof] = parseInt(el.value,10)||30; });
        S.update(S.KEYS.experts, expert.id, { servicePrices:prices, serviceDurations:durations });
        toast('تم حفظ التعديلات'); renderTab(S.getById(S.KEYS.experts, expert.id));
      };
    }
    if (state.tab==='hours'){
      document.getElementById('saveHours').onclick = function(){
        var wh = Object.assign({}, expert.workingHours||{});
        for (var i=0;i<7;i++){
          var start = document.querySelector('[data-whstart="'+i+'"]').value;
          var end = document.querySelector('[data-whend="'+i+'"]').value;
          var bs = document.querySelector('[data-brstart="'+i+'"]').value;
          var be = document.querySelector('[data-brend="'+i+'"]').value;
          if (start && end) wh[i] = { start:start, end:end, breakStart: bs||null, breakEnd: be||null };
          else delete wh[i];
        }
        S.update(S.KEYS.experts, expert.id, { workingHours: wh });
        toast('تم حفظ ساعات العمل'); renderTab(S.getById(S.KEYS.experts, expert.id));
      };
      document.getElementById('addLeaveBtn').onclick = function(){
        var from = document.getElementById('leaveFrom').value;
        var to = document.getElementById('leaveTo').value;
        if (!from || !to){ toast('يرجى تحديد الفترة'); return; }
        var leaves = (expert.leaveRequests||[]).slice();
        leaves.push({ from:from, to:to, status:'approved' });
        S.update(S.KEYS.experts, expert.id, { leaveRequests: leaves });
        toast('تم تسجيل طلب الإجازة'); renderTab(S.getById(S.KEYS.experts, expert.id));
      };
      Array.prototype.forEach.call(document.querySelectorAll('[data-delleave]'), function(el){
        el.onclick = function(){
          var leaves = (expert.leaveRequests||[]).slice();
          leaves.splice(parseInt(el.dataset.delleave,10),1);
          S.update(S.KEYS.experts, expert.id, { leaveRequests: leaves });
          renderTab(S.getById(S.KEYS.experts, expert.id));
        };
      });
    }
    if (state.tab==='notes'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-savenote]'), function(el){
        el.onclick = function(){
          var cid = el.dataset.savenote;
          var ta = document.querySelector('[data-note="'+cid+'"]');
          var notes = Object.assign({}, expert.clientNotes||{});
          notes[cid] = ta.value;
          S.update(S.KEYS.experts, expert.id, { clientNotes: notes });
          toast('تم حفظ الملاحظة');
        };
      });
    }
  }

  function showModal(title, bodyHtml){
    document.getElementById('modalRoot').innerHTML =
      '<div class="gs-modal-backdrop" id="modalBackdrop"><div class="gs-modal">'+
      '<span class="gs-close" id="modalClose">✕</span><h3>'+esc(title)+'</h3>'+bodyHtml+'</div></div>';
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBackdrop').onclick = function(e){ if(e.target.id==='modalBackdrop') closeModal(); };
  }
  function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

  renderApp();
})();
</script>
</body>
</html>
